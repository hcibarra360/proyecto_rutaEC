version: '3.8'

services:
  postgres-rutaec:
    image: postgres:15-alpine
    container_name: postgres_rutaec_container
    restart: always
    environment:
      POSTGRES_USER: rutaec
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: rutaec_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis-rutaec:
    image: redis:7-alpine
    container_name: redis_rutaec_container
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:

