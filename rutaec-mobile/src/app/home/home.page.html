<ion-header>
  <ion-toolbar color="primary">
    <ion-title>RutaEC - Inicio</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cerrarSesion()" color="light">
        <ion-icon name="log-out-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Saludo de bienvenida -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>¡Hola, {{ usuario?.nombre || 'Administrador RutaEC' }}!</ion-card-title>
      <ion-card-subtitle>Rol: {{ usuario?.rol || 'admin' }}</ion-card-subtitle>
      <ion-card-subtitle *ngIf="usuario?.email">Correo: {{ usuario?.email }}</ion-card-subtitle>
    </ion-card-header>
  </ion-card>

  <!-- Servicios de Movilidad -->
  <h3>Servicios de Movilidad</h3>
  <ion-grid>
    <ion-row>
      <ion-col size="6">
        <ion-card class="ion-text-center ion-padding">
          <ion-icon name="bus-outline" size="large" color="primary"></ion-icon>
          <ion-card-subtitle>Bus Urbano</ion-card-subtitle>
        </ion-card>
      </ion-col>
      <ion-col size="6">
        <ion-card class="ion-text-center ion-padding">
          <ion-icon name="map-outline" size="large" color="primary"></ion-icon>
          <ion-card-subtitle>Interprovincial</ion-card-subtitle>
        </ion-card>
      </ion-col>
      <ion-col size="6">
        <ion-card class="ion-text-center ion-padding">
          <ion-icon name="cube-outline" size="large" color="primary"></ion-icon>
          <ion-card-subtitle>Encomiendas</ion-card-subtitle>
        </ion-card>
      </ion-col>
      <ion-col size="6">
        <ion-card class="ion-text-center ion-padding">
          <ion-icon name="location-outline" size="large" color="success"></ion-icon>
          <ion-card-subtitle>Paradas Cercanas</ion-card-subtitle>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- Acciones Rápidas (Ubicación y Cámara) -->
  <h3>Acciones Rápidas</h3>
  <div style="display: flex; gap: 10px;">
    <ion-button expand="block" (click)="obtenerUbicacionWeb()" color="warning" style="flex: 1;">
      <ion-icon name="location-outline" slot="start"></ion-icon>
      MI UBICACIÓN
    </ion-button>

    <ion-button expand="block" (click)="abrirCamaraWeb()" color="light" style="flex: 1;">
      <ion-icon name="camera-outline" slot="start"></ion-icon>
      REPORTAR FOTO
    </ion-button>
  </div>

  <!-- Input oculto para la cámara nativa de Android -->
  <input 
    type="file" 
    accept="image/*" 
    capture="environment" 
    #fileInput 
    (change)="onFotoCapturada($event)" 
    style="display: none;" 
  />

  <!-- Previsualización de foto tomada -->
  <ion-card *ngIf="fotoUrl" class="ion-margin-top">
    <img [src]="fotoUrl" alt="Foto capturada" />
  </ion-card>
</ion-content>
